services:
  mysql:
    image: mysql:8.4
    container_name: university-erp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: student_management_system
      MYSQL_ROOT_PASSWORD: change-me
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pchange-me"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: university-erp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: university-erp-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/student_management_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: change-me
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@university-erp.local}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    volumes:
      - ./uploads:/app/uploads
    expose:
      - "8089"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health | grep -q 'UP'"]
      interval: 20s
      timeout: 5s
      retries: 5

  frontend:
    image: nginx:1.27-alpine
    container_name: university-erp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:80"
    volumes:
      - ./frontend/dist/university-erp/browser:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
  redis_data:
