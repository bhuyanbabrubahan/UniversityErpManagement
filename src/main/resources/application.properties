spring.application.name=StudentManagementSystem
server.port=8089


# ============================================================
# MYSQL DATABASE
# ============================================================

spring.datasource.url=jdbc:mysql://localhost:3306/student_management_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# JPA / HIBERNATE
# ============================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata


# ============================================================
# HIBERNATE BATCH
# ============================================================

spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true


# ============================================================
# LOGGING
# ============================================================

logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.com.sms=INFO

logging.level.org.springframework.security=TRACE
logging.level.com.sms.security=DEBUG
# ============================================================
# SWAGGER / OPENAPI
# ============================================================

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha


# ============================================================
# JACKSON
# ============================================================

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.time-zone=Asia/Kolkata


# ============================================================
# EMAIL
# ============================================================

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.protocol=smtp

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=sandbox.smtp.mailtrap.io

# Development only
spring.mail.properties.mail.debug=true


# ============================================================
# APPLICATION MAIL
# ============================================================
# Resend Email API
resend.api.key=${RESEND_API_KEY}
app.mail.from=${MAIL_FROM}
app.mail.reset-password-url=http://localhost:4200/reset-password?token=


# ============================================================
# JWT
# ============================================================

jwt.secret=${JWT_SECRET}

# Access token: 15 minutes
jwt.access-token-expiration=900000

# Refresh token: 7 days
jwt.refresh-token-expiration=604800000


# ============================================================
# FILE UPLOAD
# ============================================================

file.upload-dir=uploads/student-documents

# Maximum file size: 5 MB
file.max-size=5242880