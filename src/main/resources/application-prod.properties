spring.application.name=StudentManagementSystem

# Railway port
server.port=${PORT:8089}

# MySQL - Railway
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari connection pool
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Hibernate batch
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Logging - production
logging.level.root=INFO
logging.level.com.sms=INFO
logging.level.com.sms.security=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.web.ObservationFilterChainDecorator=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# Resend email API
resend.api.key=${RESEND_API_KEY}
app.mail.from=${MAIL_FROM}
app.mail.reset-password-url=${FRONTEND_URL}/reset-password?token=

# File upload
file.upload-dir=${FILE_UPLOAD_DIR:uploads/student-documents}
file.max-size=5242880