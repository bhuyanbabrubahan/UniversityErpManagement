@if (toast) {

  <div
    class="toast-wrapper"
    role="alert"
    [class.success]="toast.type === 'success'"
    [class.error]="toast.type === 'error'"
    [class.warning]="toast.type === 'warning'"
    [class.info]="toast.type === 'info'">

    <div class="toast-icon">
      {{ getIcon() }}
    </div>


    <div class="toast-content">

      <strong>
        {{ getTitle() }}
      </strong>

      <span>
        {{ toast.message }}
      </span>

    </div>


    <button
      type="button"
      class="toast-close"
      aria-label="Close notification"
      (click)="close()">

      ×

    </button>

  </div>

}
