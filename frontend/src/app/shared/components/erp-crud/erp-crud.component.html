<section class="erp-card"><header><div><h2>{{title}}</h2><p>Reusable ERP CRUD workspace</p></div><button type="button" (click)="reset()">New</button></header><form (ngSubmit)="save()"><div class="grid">@for(f of fields; track f){<label><span>{{f}}</span><input [(ngModel)]="model[f]" [name]="f" /></label>}</div><div class="actions"><button type="submit">{{editingId?'Update':'Save'}}</button><button type="button" (click)="reset()">Cancel</button></div></form><div class="table-wrap"><table><thead><tr><th>ID</th>@for(f of fields; track f){<th>{{f}}</th>}<th>Actions</th></tr></thead><tbody>@for(row of rows; track row.id){<tr><td>{{row.id}}</td>@for(f of fields; track f){<td>{{row[f]}}</td>}<td><button (click)="edit(row)">Edit</button><button (click)="remove(row.id)">Delete</button></td></tr>}</tbody></table></div></section>
