<form (ngSubmit)="save.emit(model)"><div class="form-grid"><label>Code<input type="text" [(ngModel)]="model.code" /></label><label>Student<input type="text" [(ngModel)]="model.student" /></label><label>Certificatetype<input type="text" [(ngModel)]="model.certificateType" /></label><label>Requestdate<input type="date" [(ngModel)]="model.requestDate" /></label><label>Issueddate<input type="date" [(ngModel)]="model.issuedDate" /></label><label>Certificateno<input type="text" [(ngModel)]="model.certificateNo" /></label><label>Status<input type="text" [(ngModel)]="model.status" /></label><label>Description<input type="text" [(ngModel)]="model.description" /></label></div><div class="form-actions"><button type="button" class="ghost" (click)="cancel.emit()">Cancel</button><button type="submit">{{submitLabel}}</button></div></form>
