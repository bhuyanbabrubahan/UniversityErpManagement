<div class="table-wrap"><table><thead><tr><th>Code</th><th>Student</th><th>Certificatetype</th><th>Requestdate</th><th>Issueddate</th><th>Certificateno</th><th>Actions</th></tr></thead><tbody><tr *ngFor="let row of rows"><ng-container><td>{{ row.code }}</td><td>{{ row.student }}</td><td>{{ row.certificateType }}</td><td>{{ row.requestDate }}</td><td>{{ row.issuedDate }}</td><td>{{ row.certificateNo }}</td></ng-container><td class="actions"><a [routerLink]="['./',row.id]">View</a><a [routerLink]="['./edit',row.id]">Edit</a><button (click)="remove.emit(row.id)">Delete</button></td></tr><tr *ngIf="!rows.length"><td colspan="8" class="empty">No records found.</td></tr></tbody></table></div>
