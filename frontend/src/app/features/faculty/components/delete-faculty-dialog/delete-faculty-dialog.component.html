<div class="delete-dialog">

  <!-- =====================================================
       HEADER
  ===================================================== -->

  <div class="dialog-header">

    <div class="warning-icon">
      <mat-icon>
        warning
      </mat-icon>
    </div>

    <div class="header-content">

      <h2>
        Delete Faculty
      </h2>

      <p>
        Confirm faculty deletion
      </p>

    </div>

  </div>


  <!-- =====================================================
       CONTENT
  ===================================================== -->

  <mat-dialog-content class="dialog-content">

    <p class="main-message">
      Are you sure you want to delete this faculty?
    </p>

    <div class="warning-box">

      <div class="warning-box-icon">

        <mat-icon>
          info
        </mat-icon>

      </div>

      <div class="warning-box-content">

        <strong>
          Important
        </strong>

        <span>
          This action will deactivate the faculty record.
        </span>

      </div>

    </div>

  </mat-dialog-content>


  <!-- =====================================================
       ACTIONS
  ===================================================== -->

  <mat-dialog-actions class="dialog-actions">

    <button
      type="button"
      class="cancel-button"
      (click)="cancel()"
    >

      <span>
        Cancel
      </span>

    </button>


    <button
      type="button"
      class="delete-button"
      (click)="confirm()"
    >

      <mat-icon>
        delete_outline
      </mat-icon>

      <span>
        Delete Faculty
      </span>

    </button>

  </mat-dialog-actions>

</div>
