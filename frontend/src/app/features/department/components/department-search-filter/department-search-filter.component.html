<form
  class="search-filter"
  [formGroup]="searchForm"
  (ngSubmit)="onSearch()">

  <div class="filter-grid">

    <!-- =====================================================
         DEPARTMENT NAME
         ===================================================== -->

    <div class="filter-field">

      <label for="departmentName">
        Department Name
      </label>

      <input
        id="departmentName"
        type="text"
        formControlName="departmentName"
        placeholder="Search by department name"
        autocomplete="off" />

    </div>


    <!-- =====================================================
         DEPARTMENT CODE
         ===================================================== -->

    <div class="filter-field">

      <label for="departmentCode">
        Department Code
      </label>

      <input
        id="departmentCode"
        type="text"
        formControlName="departmentCode"
        placeholder="Search by code"
        autocomplete="off" />

    </div>


    <!-- =====================================================
         STATUS
         ===================================================== -->

    <div class="filter-field">

      <label for="status">
        Status
      </label>

      <select
        id="status"
        formControlName="status">

        <option value="">
          All Status
        </option>

        @for (
          status of statusOptions;
          track status
        ) {

          <option [value]="status">
            {{ status }}
          </option>

        }

      </select>

    </div>

  </div>


  <!-- =====================================================
       ACTIONS
       ===================================================== -->

  <div class="filter-actions">

    <button
      type="submit"
      class="btn btn-primary">

      Search

    </button>


    <button
      type="button"
      class="btn btn-secondary"
      (click)="onReset()">

      Reset

    </button>

  </div>

</form>
