<form (ngSubmit)="save.emit(model)"><div class="form-grid"><label>Code<input type="text" [(ngModel)]="model.code" /></label><label>Bookcode<input type="text" [(ngModel)]="model.bookCode" /></label><label>Title<input type="text" [(ngModel)]="model.title" /></label><label>Author<input type="text" [(ngModel)]="model.author" /></label><label>Isbn<input type="text" [(ngModel)]="model.isbn" /></label><label>Category<input type="text" [(ngModel)]="model.category" /></label><label>Totalcopies<input type="number" [(ngModel)]="model.totalCopies" /></label><label>Availablecopies<input type="number" [(ngModel)]="model.availableCopies" /></label><label>Status<input type="text" [(ngModel)]="model.status" /></label><label>Description<input type="text" [(ngModel)]="model.description" /></label></div><div class="form-actions"><button type="button" class="ghost" (click)="cancel.emit()">Cancel</button><button type="submit">{{submitLabel}}</button></div></form>
