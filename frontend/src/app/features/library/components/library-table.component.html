<div class="table-wrap"><table><thead><tr><th>Code</th><th>Bookcode</th><th>Title</th><th>Author</th><th>Isbn</th><th>Category</th><th>Actions</th></tr></thead><tbody><tr *ngFor="let row of rows"><ng-container><td>{{ row.code }}</td><td>{{ row.bookCode }}</td><td>{{ row.title }}</td><td>{{ row.author }}</td><td>{{ row.isbn }}</td><td>{{ row.category }}</td></ng-container><td class="actions"><a [routerLink]="['./',row.id]">View</a><a [routerLink]="['./edit',row.id]">Edit</a><button (click)="remove.emit(row.id)">Delete</button></td></tr><tr *ngIf="!rows.length"><td colspan="8" class="empty">No records found.</td></tr></tbody></table></div>
