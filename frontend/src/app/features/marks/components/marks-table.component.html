<div class="table-wrap"><table><thead><tr><th>Code</th><th>Academicyear</th><th>Semester</th><th>Exam</th><th>Course</th><th>Subject</th><th>Actions</th></tr></thead><tbody><tr *ngFor="let row of rows"><ng-container><td>{{ row.code }}</td><td>{{ row.academicYear }}</td><td>{{ row.semester }}</td><td>{{ row.exam }}</td><td>{{ row.course }}</td><td>{{ row.subject }}</td></ng-container><td class="actions"><a [routerLink]="['./',row.id]">View</a><a [routerLink]="['./edit',row.id]">Edit</a><button (click)="remove.emit(row.id)">Delete</button></td></tr><tr *ngIf="!rows.length"><td colspan="8" class="empty">No records found.</td></tr></tbody></table></div>
