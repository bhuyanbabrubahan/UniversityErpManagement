<form (ngSubmit)="save.emit(model)"><div class="form-grid"><label>Code<input type="text" [(ngModel)]="model.code" /></label><label>Academicyear<input type="text" [(ngModel)]="model.academicYear" /></label><label>Semester<input type="text" [(ngModel)]="model.semester" /></label><label>Exam<input type="text" [(ngModel)]="model.exam" /></label><label>Course<input type="text" [(ngModel)]="model.course" /></label><label>Subject<input type="text" [(ngModel)]="model.subject" /></label><label>Student<input type="text" [(ngModel)]="model.student" /></label><label>Faculty<input type="text" [(ngModel)]="model.faculty" /></label><label>Maxmarks<input type="number" [(ngModel)]="model.maxMarks" /></label><label>Obtainedmarks<input type="number" [(ngModel)]="model.obtainedMarks" /></label><label>Status<input type="text" [(ngModel)]="model.status" /></label><label>Description<input type="text" [(ngModel)]="model.description" /></label></div><div class="form-actions"><button type="button" class="ghost" (click)="cancel.emit()">Cancel</button><button type="submit">{{submitLabel}}</button></div></form>
