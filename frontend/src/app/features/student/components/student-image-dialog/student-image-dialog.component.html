<div class="student-image-dialog">

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <div
    mat-dialog-title
    class="image-dialog-header"
  >

    <div class="image-dialog-title">

      <mat-icon>
        account_circle
      </mat-icon>

      <span>
        {{ data.studentName }}
      </span>

    </div>


    <button
      mat-icon-button
      type="button"
      aria-label="Close"
      (click)="close()"
    >

      <mat-icon>
        close
      </mat-icon>

    </button>

  </div>


  <!-- =====================================================
       IMAGE
       ===================================================== -->

  <div
    mat-dialog-content
    class="image-dialog-content"
  >

    <img
      class="full-profile-image"
      [src]="data.imageUrl"
      [alt]="data.studentName"
    />

  </div>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <div
    mat-dialog-actions
    align="end"
    class="image-dialog-actions"
  >

    <button
      mat-button
      type="button"
      (click)="close()"
    >

      Close

    </button>

  </div>

</div>
