<mat-card class="search-card">

  <div class="search-header">

    <div class="header-title">
      <h2>Student Search</h2>
      <p>Search students using one or more filters.</p>
    </div>

    <div class="header-buttons">

      <button mat-stroked-button color="primary" (click)="clear()">
        <mat-icon>refresh</mat-icon>
        Reset
      </button>

      <button mat-flat-button color="primary" (click)="submitSearch()">
        <mat-icon>search</mat-icon>
        Search
      </button>

    </div>

  </div>

  <mat-divider></mat-divider>

  <mat-card-content>

    <form [formGroup]="searchForm" class="search-form">

      <mat-form-field appearance="outline">
        <mat-label>Roll Number</mat-label>
        <mat-icon matPrefix>badge</mat-icon>
        <input matInput formControlName="rollNumber">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>First Name</mat-label>
        <mat-icon matPrefix>person</mat-icon>
        <input matInput formControlName="firstName">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Last Name</mat-label>
        <mat-icon matPrefix>person_outline</mat-icon>
        <input matInput formControlName="lastName">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Gender</mat-label>
        <mat-icon matPrefix>wc</mat-icon>
        <mat-select formControlName="gender">
          <mat-option [value]="null">All</mat-option>
          <mat-option value="MALE">Male</mat-option>
          <mat-option value="FEMALE">Female</mat-option>
          <mat-option value="OTHER">Other</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-icon matPrefix>verified</mat-icon>
        <mat-select formControlName="status">
          <mat-option [value]="null">All</mat-option>
          <mat-option value="ACTIVE">Active</mat-option>
          <mat-option value="DELETED">Deleted</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>District</mat-label>
        <mat-icon matPrefix>location_city</mat-icon>
        <input matInput formControlName="district">
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Pincode</mat-label>
        <mat-icon matPrefix>pin_drop</mat-icon>
        <input matInput formControlName="pincode">
      </mat-form-field>

    </form>

  </mat-card-content>

</mat-card>
