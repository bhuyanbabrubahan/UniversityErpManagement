<form (ngSubmit)="save.emit(model)"><div class="form-grid"><label>Code<input type="text" [(ngModel)]="model.code" /></label><label>Companyname<input type="text" [(ngModel)]="model.companyName" /></label><label>Drivedate<input type="date" [(ngModel)]="model.driveDate" /></label><label>Jobtitle<input type="text" [(ngModel)]="model.jobTitle" /></label><label>Packageamount<input type="number" [(ngModel)]="model.packageAmount" /></label><label>Eligibility<input type="text" [(ngModel)]="model.eligibility" /></label><label>Selectedstudents<input type="number" [(ngModel)]="model.selectedStudents" /></label><label>Status<input type="text" [(ngModel)]="model.status" /></label><label>Description<input type="text" [(ngModel)]="model.description" /></label></div><div class="form-actions"><button type="button" class="ghost" (click)="cancel.emit()">Cancel</button><button type="submit">{{submitLabel}}</button></div></form>
