<div class="table-wrap"><table><thead><tr><th>Code</th><th>Companyname</th><th>Drivedate</th><th>Jobtitle</th><th>Packageamount</th><th>Eligibility</th><th>Actions</th></tr></thead><tbody><tr *ngFor="let row of rows"><ng-container><td>{{ row.code }}</td><td>{{ row.companyName }}</td><td>{{ row.driveDate }}</td><td>{{ row.jobTitle }}</td><td>{{ row.packageAmount }}</td><td>{{ row.eligibility }}</td></ng-container><td class="actions"><a [routerLink]="['./',row.id]">View</a><a [routerLink]="['./edit',row.id]">Edit</a><button (click)="remove.emit(row.id)">Delete</button></td></tr><tr *ngIf="!rows.length"><td colspan="8" class="empty">No records found.</td></tr></tbody></table></div>
