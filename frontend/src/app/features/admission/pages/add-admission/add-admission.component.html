<section class="page">

  <header class="page-header">

    <div class="page-heading">

      <p class="eyebrow">
        Admission Management
      </p>

      <h1>
        Add Admission
      </h1>

      <p class="description">
        Create a new admission.
      </p>

    </div>

  </header>


  <app-admission-form
    mode="create"
    [submitting]="submitting"
    (submitted)="submit($event)"
    (cancelled)="cancel()">
  </app-admission-form>

</section>
