<form (ngSubmit)="save.emit(model)"><div class="form-grid"><label>Code<input type="text" [(ngModel)]="model.code" /></label><label>Ticketno<input type="text" [(ngModel)]="model.ticketNo" /></label><label>Raisedby<input type="text" [(ngModel)]="model.raisedBy" /></label><label>Category<input type="text" [(ngModel)]="model.category" /></label><label>Subject<input type="text" [(ngModel)]="model.subject" /></label><label>Description<input type="text" [(ngModel)]="model.description" /></label><label>Assignedto<input type="text" [(ngModel)]="model.assignedTo" /></label><label>Resolution<input type="text" [(ngModel)]="model.resolution" /></label><label>Status<input type="text" [(ngModel)]="model.status" /></label></div><div class="form-actions"><button type="button" class="ghost" (click)="cancel.emit()">Cancel</button><button type="submit">{{submitLabel}}</button></div></form>
