<div class="table-wrap"><table><thead><tr><th>Code</th><th>Ticketno</th><th>Raisedby</th><th>Category</th><th>Subject</th><th>Description</th><th>Actions</th></tr></thead><tbody><tr *ngFor="let row of rows"><ng-container><td>{{ row.code }}</td><td>{{ row.ticketNo }}</td><td>{{ row.raisedBy }}</td><td>{{ row.category }}</td><td>{{ row.subject }}</td><td>{{ row.description }}</td></ng-container><td class="actions"><a [routerLink]="['./',row.id]">View</a><a [routerLink]="['./edit',row.id]">Edit</a><button (click)="remove.emit(row.id)">Delete</button></td></tr><tr *ngIf="!rows.length"><td colspan="8" class="empty">No records found.</td></tr></tbody></table></div>
