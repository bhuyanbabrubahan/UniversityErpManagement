<mat-card class="stat-card">

  <mat-card-content>

    <div class="stat-top">

      <div class="stat-icon">
        <mat-icon>{{ stat().icon }}</mat-icon>
      </div>

      <button
        mat-icon-button
        type="button"
        class="stat-action"
        aria-label="View details"
        matTooltip="View details">

        <mat-icon>arrow_forward</mat-icon>

      </button>

    </div>


    <div class="stat-body">

      <span class="stat-label">
        {{ stat().title }}
      </span>

      <strong class="stat-value">
        {{ stat().value | number }}
      </strong>

    </div>

  </mat-card-content>

</mat-card>
