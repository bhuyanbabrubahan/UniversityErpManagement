<div class="table-wrap"><table><thead><tr><th>Code</th><th>Title</th><th>Principalinvestigator</th><th>Department</th><th>Grantamount</th><th>Startdate</th><th>Actions</th></tr></thead><tbody><tr *ngFor="let row of rows"><ng-container><td>{{ row.code }}</td><td>{{ row.title }}</td><td>{{ row.principalInvestigator }}</td><td>{{ row.department }}</td><td>{{ row.grantAmount }}</td><td>{{ row.startDate }}</td></ng-container><td class="actions"><a [routerLink]="['./',row.id]">View</a><a [routerLink]="['./edit',row.id]">Edit</a><button (click)="remove.emit(row.id)">Delete</button></td></tr><tr *ngIf="!rows.length"><td colspan="8" class="empty">No records found.</td></tr></tbody></table></div>
