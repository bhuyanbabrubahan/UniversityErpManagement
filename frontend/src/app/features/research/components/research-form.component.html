<form (ngSubmit)="save.emit(model)"><div class="form-grid"><label>Code<input type="text" [(ngModel)]="model.code" /></label><label>Title<input type="text" [(ngModel)]="model.title" /></label><label>Principalinvestigator<input type="text" [(ngModel)]="model.principalInvestigator" /></label><label>Department<input type="text" [(ngModel)]="model.department" /></label><label>Grantamount<input type="number" [(ngModel)]="model.grantAmount" /></label><label>Startdate<input type="date" [(ngModel)]="model.startDate" /></label><label>Enddate<input type="date" [(ngModel)]="model.endDate" /></label><label>Status<input type="text" [(ngModel)]="model.status" /></label><label>Description<input type="text" [(ngModel)]="model.description" /></label></div><div class="form-actions"><button type="button" class="ghost" (click)="cancel.emit()">Cancel</button><button type="submit">{{submitLabel}}</button></div></form>
