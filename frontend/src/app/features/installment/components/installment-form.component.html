<form (ngSubmit)="save.emit(model)"><div class="form-grid"><label>Code<input type="text" [(ngModel)]="model.code" /></label><label>Student<input type="text" [(ngModel)]="model.student" /></label><label>Feehead<input type="text" [(ngModel)]="model.feeHead" /></label><label>Installmentno<input type="number" [(ngModel)]="model.installmentNo" /></label><label>Duedate<input type="date" [(ngModel)]="model.dueDate" /></label><label>Amount<input type="number" [(ngModel)]="model.amount" /></label><label>Paidamount<input type="number" [(ngModel)]="model.paidAmount" /></label><label>Status<input type="text" [(ngModel)]="model.status" /></label><label>Description<input type="text" [(ngModel)]="model.description" /></label></div><div class="form-actions"><button type="button" class="ghost" (click)="cancel.emit()">Cancel</button><button type="submit">{{submitLabel}}</button></div></form>
