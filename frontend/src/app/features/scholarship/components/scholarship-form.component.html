<form (ngSubmit)="save.emit(model)"><div class="form-grid"><label>Code<input type="text" [(ngModel)]="model.code" /></label><label>Student<input type="text" [(ngModel)]="model.student" /></label><label>Scholarshipname<input type="text" [(ngModel)]="model.scholarshipName" /></label><label>Provider<input type="text" [(ngModel)]="model.provider" /></label><label>Amount<input type="number" [(ngModel)]="model.amount" /></label><label>Academicyear<input type="text" [(ngModel)]="model.academicYear" /></label><label>Status<input type="text" [(ngModel)]="model.status" /></label><label>Description<input type="text" [(ngModel)]="model.description" /></label></div><div class="form-actions"><button type="button" class="ghost" (click)="cancel.emit()">Cancel</button><button type="submit">{{submitLabel}}</button></div></form>
