@if (semester) {

  <div
    class="dialog-backdrop"
    role="presentation">

    <section
      class="dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="delete-semester-title">

      <div class="dialog-icon">
        !
      </div>


      <div class="dialog-content">

        <h2 id="delete-semester-title">
          Delete Semester?
        </h2>

        <p>

          You are about to delete

          <strong>
            {{ semester.semesterName }}
          </strong>

          from

          <strong>
            {{ semester.courseName }}
          </strong>.

        </p>

        <p class="warning">

          This action will soft-delete the semester record.

        </p>

      </div>


      <div class="dialog-actions">

        <button
          type="button"
          class="cancel-btn"
          [disabled]="loading"
          (click)="onCancel()">

          Cancel

        </button>


        <button
          type="button"
          class="delete-btn"
          [disabled]="loading"
          (click)="onConfirm()">

          @if (loading) {

            Deleting...

          } @else {

            Delete Semester

          }

        </button>

      </div>

    </section>

  </div>

}
