<div
  class="dialog-backdrop"
  role="presentation"
>

  <div
    class="delete-dialog"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="delete-dialog-title"
    aria-describedby="delete-dialog-description"
  >

    <!-- ======================================================
         DIALOG ICON
    ======================================================= -->

    <div
      class="dialog-icon"
      aria-hidden="true"
    >
      <mat-icon>
        delete_outline
      </mat-icon>
    </div>


    <!-- ======================================================
         CONTENT
    ======================================================= -->

    <div class="dialog-content">

      <h2 id="delete-dialog-title">
        Delete Document?
      </h2>

      <p id="delete-dialog-description">
        Are you sure you want to delete this student document?
        The document will no longer be available as an active record.
      </p>


      <!-- ====================================================
           DOCUMENT PREVIEW
      ===================================================== -->

      @if (document) {

        <div class="document-preview">

          <div class="preview-icon">
            <mat-icon>
              description
            </mat-icon>
          </div>

          <div class="preview-content">

            <strong
              [title]="document.originalFileName"
            >
              {{ document.originalFileName }}
            </strong>

            <span>
              Document #{{ document.id }}
            </span>

          </div>

        </div>

      }

    </div>


    <!-- ======================================================
         ACTIONS
    ======================================================= -->

    <div class="dialog-actions">

      <button
        type="button"
        class="cancel-button"
        [disabled]="loading"
        (click)="cancel()"
      >
        Cancel
      </button>


      <button
        type="button"
        class="delete-button"
        [disabled]="loading || !document"
        (click)="confirm()"
      >

        @if (loading) {

          <span class="button-content">

            <span
              class="loading-spinner"
              aria-hidden="true"
            ></span>

            <span>
              Deleting...
            </span>

          </span>

        } @else {

          <span class="button-content">

            <mat-icon>
              delete_outline
            </mat-icon>

            <span>
              Delete Document
            </span>

          </span>

        }

      </button>

    </div>

  </div>

</div>
