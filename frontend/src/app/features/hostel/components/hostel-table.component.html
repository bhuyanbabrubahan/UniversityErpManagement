<div class="table-wrap"><table><thead><tr><th>Code</th><th>Hostelname</th><th>Roomno</th><th>Capacity</th><th>Occupied</th><th>Bedsfee</th><th>Actions</th></tr></thead><tbody><tr *ngFor="let row of rows"><ng-container><td>{{ row.code }}</td><td>{{ row.hostelName }}</td><td>{{ row.roomNo }}</td><td>{{ row.capacity }}</td><td>{{ row.occupied }}</td><td>{{ row.bedsFee }}</td></ng-container><td class="actions"><a [routerLink]="['./',row.id]">View</a><a [routerLink]="['./edit',row.id]">Edit</a><button (click)="remove.emit(row.id)">Delete</button></td></tr><tr *ngIf="!rows.length"><td colspan="8" class="empty">No records found.</td></tr></tbody></table></div>
