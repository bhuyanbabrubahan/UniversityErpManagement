<form (ngSubmit)="save.emit(model)"><div class="form-grid"><label>Code<input type="text" [(ngModel)]="model.code" /></label><label>Hostelname<input type="text" [(ngModel)]="model.hostelName" /></label><label>Roomno<input type="text" [(ngModel)]="model.roomNo" /></label><label>Capacity<input type="number" [(ngModel)]="model.capacity" /></label><label>Occupied<input type="number" [(ngModel)]="model.occupied" /></label><label>Bedsfee<input type="text" [(ngModel)]="model.bedsFee" /></label><label>Status<input type="text" [(ngModel)]="model.status" /></label><label>Description<input type="text" [(ngModel)]="model.description" /></label></div><div class="form-actions"><button type="button" class="ghost" (click)="cancel.emit()">Cancel</button><button type="submit">{{submitLabel}}</button></div></form>
