<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Code</th>
        <th>Employeecode</th>
        <th>Fullname</th>
        <th>Department</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let row of rows">
        <ng-container
          ><td>{{ row.code }}</td>
          <td>{{ row.employeeCode }}</td>
          <td>{{ row.fullName }}</td>
          <td>{{ row.department }}</td>
          <td>{{ row.email }}</td>
          <td>{{ row.phone }}</td></ng-container
        >
        <td class="actions">
          <a [routerLink]="['./', row.id]">View</a
          ><a [routerLink]="['./edit', row.id]">Edit</a
          ><button (click)="remove.emit(row.id)">Delete</button>
        </td>
      </tr>
      <tr *ngIf="!rows.length">
        <td colspan="8" class="empty">No records found.</td>
      </tr>
    </tbody>
  </table>
</div>
