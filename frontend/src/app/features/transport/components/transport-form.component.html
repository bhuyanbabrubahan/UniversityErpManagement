<form (ngSubmit)="save.emit(model)"><div class="form-grid"><label>Code<input type="text" [(ngModel)]="model.code" /></label><label>Vehicleno<input type="text" [(ngModel)]="model.vehicleNo" /></label><label>Route<input type="text" [(ngModel)]="model.route" /></label><label>Driver<input type="text" [(ngModel)]="model.driver" /></label><label>Capacity<input type="number" [(ngModel)]="model.capacity" /></label><label>Fee<input type="text" [(ngModel)]="model.fee" /></label><label>Status<input type="text" [(ngModel)]="model.status" /></label><label>Description<input type="text" [(ngModel)]="model.description" /></label></div><div class="form-actions"><button type="button" class="ghost" (click)="cancel.emit()">Cancel</button><button type="submit">{{submitLabel}}</button></div></form>
