<div class="table-wrap"><table><thead><tr><th>Code</th><th>Vehicleno</th><th>Route</th><th>Driver</th><th>Capacity</th><th>Fee</th><th>Actions</th></tr></thead><tbody><tr *ngFor="let row of rows"><ng-container><td>{{ row.code }}</td><td>{{ row.vehicleNo }}</td><td>{{ row.route }}</td><td>{{ row.driver }}</td><td>{{ row.capacity }}</td><td>{{ row.fee }}</td></ng-container><td class="actions"><a [routerLink]="['./',row.id]">View</a><a [routerLink]="['./edit',row.id]">Edit</a><button (click)="remove.emit(row.id)">Delete</button></td></tr><tr *ngIf="!rows.length"><td colspan="8" class="empty">No records found.</td></tr></tbody></table></div>
